<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>计划星球</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3478f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="计划星球">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--green:#34c759;--red:#ff3b30;--gray:#b8b8bd;--blue:#007aff;--orange:#ff9500;
  --purple:#af52de;--bg:#f2f2f7;--line:#e5e5ea;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;}
body{background:#d8d8de;display:flex;justify-content:center;min-height:100vh;}
.phone{width:390px;max-width:100%;background:var(--bg);min-height:100vh;position:relative;box-shadow:0 0 30px rgba(0,0,0,.18);}
.statusbar{height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;background:#fff;}
.nav{height:52px;display:flex;align-items:center;gap:4px;padding:0 12px;background:#fff;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
.nav h1{font-size:17px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.back{font-size:26px;color:var(--blue);cursor:pointer;padding:0 6px;line-height:1;}
.addbtn{width:32px;height:32px;border-radius:16px;background:var(--blue);color:#fff;font-size:22px;
  border:none;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.navlink{font-size:14px;color:var(--blue);cursor:pointer;padding:0 6px;flex-shrink:0;}
.page{padding:13px;padding-bottom:86px;}
/* tabbar */
.tabbar{position:fixed;bottom:0;width:390px;max-width:100%;height:66px;background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;z-index:30;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10.5px;color:var(--gray);cursor:pointer;gap:2px;}
.tab.active{color:var(--blue);}
.tab .ico{font-size:20px;line-height:1;}
/* card */
.card{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:11px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.card-title{font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.tip{font-size:11px;color:#a8a8ae;font-weight:400;}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;color:#666;}
.kv b{color:#111;font-weight:500;}
.dep{color:var(--purple);}
/* plan row */
.plan-head{display:flex;align-items:center;gap:10px;cursor:pointer;padding-bottom:6px;}
.plan-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:20px;flex-shrink:0;}
.plan-head .meta{flex:1;min-width:0;}
.plan-head .meta b{font-size:15.5px;}
.plan-head .meta small{color:#a8a8ae;display:block;font-size:11.5px;margin-top:2px;}
.chev{color:#c7c7cc;font-size:18px;flex-shrink:0;}
.chev.small{font-size:15px;}
/* task row */
.task{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #f4f4f6;cursor:pointer;}
.task:last-of-type{border-bottom:none;}
.task .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.task .t-main{flex:1;min-width:0;}
.task .t-name{font-size:13.5px;}
.task .t-sub{font-size:11px;color:#a0a0a6;margin-top:2px;line-height:1.5;}
.task.dim{opacity:.6;}
.tag{font-size:9.5px;background:#f0f0f3;color:#7a7a80;border-radius:4px;padding:1px 5px;margin-left:4px;}
.tag.early-tag{background:#e5f6fb;color:#0a8bb0;}
.tag.makeup-tag{background:#fff3e0;color:#c66a00;}
.info-i{font-size:10px;color:#b0b0c0;cursor:pointer;margin-left:3px;font-style:normal;
  border:1px solid #d8d8de;border-radius:50%;width:13px;height:13px;display:inline-flex;
  align-items:center;justify-content:center;vertical-align:1px;}
.info-i:active{background:#eef3ff;color:var(--blue);}
.ghost{width:100%;padding:9px;border:none;border-radius:10px;background:#f5f7ff;color:var(--blue);
  font-size:12.5px;cursor:pointer;margin-top:9px;}
.strike{text-decoration:line-through;color:#b0b0b6;}
/* 勾选框 */
.chk{width:21px;height:21px;border-radius:50%;border:1.8px solid #d4d4da;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;cursor:pointer;transition:.15s;}
.chk.on{background:var(--green);border-color:var(--green);}
.st-tag{font-size:10px;padding:2px 7px;border-radius:6px;border:0.5px solid transparent;flex-shrink:0;}
/* 甘特图 */
.gtip{font-size:10.5px;color:#a8a8ae;font-weight:400;}
.gantt-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 6px;}
.gantt-nav b{font-size:13px;}
.gnav{font-size:19px;color:var(--blue);cursor:pointer;padding:0 8px;}
.g-legend{display:flex;gap:9px;font-size:10px;color:#8a8a90;flex-wrap:wrap;margin-bottom:7px;}
.g-legend span{display:flex;align-items:center;gap:3px;}
.g-legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}
.g-wrap{display:flex;overflow:hidden;border-radius:6px;}
.g-labels{flex-shrink:0;width:76px;}
.g-lh{height:18px;}
.g-l{height:22px;font-size:9.5px;color:#666;line-height:22px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;padding-right:6px;}
.g-scroll{flex:1;overflow:hidden;padding-bottom:2px;}
.g-days{display:flex;height:18px;}
.g-d{flex:1 1 0;min-width:0;font-size:7.5px;color:#a8a8ae;text-align:center;line-height:18px;overflow:hidden;}
.g-row2{display:flex;height:22px;align-items:center;}
.g-cell{flex:1 1 0;min-width:0;height:15px;border-radius:2px;box-sizing:border-box;
  margin:0;border-right:1px solid #fff;}
.g-cell.blank{background:#fafafc!important;border-right-color:#f4f4f8;}
.g-summary{margin-top:10px;border-top:1px solid #f0f0f3;padding-top:8px;}
.gs-row{display:flex;font-size:10.5px;color:#8a8a90;padding:3px 0;gap:6px;}
.gs-row b{color:#444;font-weight:500;flex-shrink:0;}
.gs-right{margin-left:auto;color:#6a6a70;flex-shrink:0;}
/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.cal-head b{font-size:15px;}
.cal-nav{font-size:19px;color:var(--blue);cursor:pointer;padding:0 10px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-grid.head div{text-align:center;font-size:10px;color:#a8a8ae;padding-bottom:3px;}
.cal-cell{aspect-ratio:1;background:#fafafa;border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;position:relative;padding-top:2px;}
.cal-cell.today{box-shadow:inset 0 0 0 1.6px var(--blue);}
.cal-cell.sel{background:var(--blue);}
.cal-cell.sel .cd{color:#fff;font-weight:700;}
.cd{font-size:13px;}
.cal-dots{display:flex;gap:1.5px;margin-top:2px;height:5px;align-items:center;}
.cal-dots i{width:4px;height:4px;border-radius:50%;}
.cmore{font-size:7px;color:#a8a8ae;}
/* report */
.score{display:flex;align-items:center;gap:15px;}
.score-num{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;}
.score-num b{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;
  align-items:center;justify-content:center;font-size:19px;}
.score-info{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:#8a8a90;}
.score-info b{font-size:14.5px;color:#111;}
.bar-row{display:flex;align-items:center;gap:8px;font-size:11.5px;margin:7px 0;}
.bar-row .lbl{width:78px;color:#666;flex-shrink:0;}
.bar-row .track{flex:1;height:7px;background:#eee;border-radius:4px;overflow:hidden;}
.bar-row .fill{height:100%;border-radius:4px;}
.bar-row .val{width:32px;text-align:right;font-weight:600;flex-shrink:0;}
.prow{display:flex;align-items:center;gap:7px;padding:10px 0;border-bottom:1px solid #f6f6f8;cursor:pointer;}
.arrow{color:#c0c0c6;font-size:14px;transition:transform .18s;display:inline-block;}
.arrow.down{transform:rotate(90deg);}
.pname{font-size:13.5px;font-weight:500;}
.pstats{margin-left:auto;font-size:13px;font-weight:600;}
.pmini{font-size:11px;color:#a8a8ae;width:44px;text-align:right;}
.pexpand{background:#fafbfd;border-radius:9px;padding:9px;margin:4px 0 8px;}
.psub{display:flex;gap:9px;font-size:10.5px;color:#7a7a80;flex-wrap:wrap;margin-bottom:6px;}
.rtable{width:100%;font-size:11px;border-collapse:collapse;}
.rtable th{color:#a0a0a6;font-weight:400;text-align:right;padding:5px 3px;border-bottom:1px solid #eee;white-space:nowrap;}
.rtable td{text-align:right;padding:6px 3px;border-bottom:1px solid #f5f5f8;}
.rtable th:first-child,.rtable td:first-child{text-align:left;}
.rtable tr.zero td{color:#c0c0c6;}
.rtable td.red{color:var(--red);font-weight:600;}
.rtable tr.tempr td{color:var(--purple);}
.norec{font-size:9px;color:#c0c0c6;margin-left:4px;background:#f4f4f6;padding:1px 4px;border-radius:3px;}
.advice{font-size:12px;color:#555;line-height:1.85;margin-top:7px;}
/* modal */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;z-index:60;justify-content:center;}
.mask.center{align-items:center;padding:24px;}
.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px 15px 26px;max-height:86%;overflow:auto;}
.mask.center .sheet{border-radius:16px;max-height:80%;}
.sheet h3{font-size:16.5px;margin-bottom:13px;text-align:center;}
.sheet-desc{text-align:center;color:#9a9aa0;font-size:12px;line-height:1.7;margin-bottom:13px;}
.field{margin-bottom:11px;}
.field label{font-size:11.5px;color:#8a8a90;display:block;margin-bottom:5px;}
.field input,.field select{width:100%;padding:9px;border:1px solid #e2e2e7;border-radius:9px;
  font-size:14.5px;background:#fafafc;}
.field input:focus,.field select:focus{outline:none;border-color:var(--blue);background:#fff;}
.field input.err{border-color:var(--red);background:#fff6f5;}
.err-msg{color:var(--red);font-size:11px;margin-top:4px;display:none;}
.err-msg.show{display:block;}
.inline2{display:flex;gap:7px;}
.inline2>*{flex:1;min-width:0;}
.icon-pick{display:flex;gap:6px;flex-wrap:wrap;}
.icon-pick span{width:36px;height:36px;border-radius:9px;background:#f2f2f7;display:flex;
  align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:2px solid transparent;}
.icon-pick span.on{border-color:var(--blue);background:#eaf3ff;}
.md-pick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.md-pick span{text-align:center;padding:7px 0;border-radius:7px;background:#f2f2f7;
  font-size:12px;cursor:pointer;color:#666;user-select:none;}
.md-pick span.on{background:var(--blue);color:#fff;font-weight:600;}
.wd-pick{display:flex;gap:4px;}
.wd-pick span{flex:1;text-align:center;padding:9px 0;border-radius:8px;background:#f2f2f7;
  font-size:12px;cursor:pointer;color:#666;min-width:0;user-select:none;}
.wd-pick span.on{background:var(--blue);color:#fff;font-weight:600;}
.quick{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.quick button{font-size:11.5px;padding:5px 9px;border-radius:13px;border:1px solid #dcdce1;
  background:#fff;cursor:pointer;color:#444;}
.quick button.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.quick .primary-sm{background:var(--blue);color:#fff;border-color:var(--blue);}
.primary{width:100%;padding:12px;border:none;border-radius:11px;background:var(--blue);
  color:#fff;font-size:15px;cursor:pointer;margin-top:5px;}
.primary.green{background:var(--green);}
.danger-bg{background:var(--red);}
.secondary{width:100%;padding:12px;border:none;border-radius:11px;background:#f0f0f3;
  color:#333;font-size:14px;cursor:pointer;margin-top:7px;}
.danger{width:100%;padding:12px;border-radius:11px;background:#fff;color:var(--red);
  font-size:14px;cursor:pointer;margin-top:7px;border:1px solid #ffd9d6;}
.remark{font-size:11px;color:#9a9aa0;line-height:1.65;margin-top:7px;}
.hintbox{background:#f7f9ff;border:1px solid #dfe8ff;border-radius:10px;padding:9px 11px;
  font-size:11.5px;color:#4a6ea8;line-height:1.65;margin-bottom:11px;}
.chkrow{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;color:#333;cursor:pointer;line-height:1.45;}
.chkrow input{width:16px;height:16px;flex-shrink:0;margin-top:2px;accent-color:var(--blue);}
.chkrow small{color:#9a9aa0;font-size:10.5px;}
.empty{text-align:center;color:var(--gray);font-size:12.5px;padding:22px 0;}

/* 我的页面 */
.me-head{display:flex;align-items:center;gap:12px;}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#eaf3ff,#f3eaff);
  display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
.me-info{display:flex;flex-direction:column;gap:3px;}
.me-info b{font-size:16px;}
.me-info span{font-size:11.5px;color:#8a8a90;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px;}
.stat{background:#f8f9fc;border-radius:10px;padding:10px 4px;text-align:center;}
.stat b{font-size:17px;display:block;color:#1f9d46;}
.stat b.orange{color:var(--orange);}
.stat b.cyan{color:#30b0c7;}
.stat b.purple{color:var(--purple);}
.stat span{font-size:9.5px;color:#8a8a90;}
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px;}
.badge{background:#f4f4f7;border-radius:11px;padding:10px 4px;text-align:center;cursor:pointer;
  opacity:.72;}
.badge:not(.on) .b-ico{filter:grayscale(.35);opacity:.62;}
.badge:not(.on) .b-name{color:#8d8d95;}
.badge:not(.on) .b-desc{color:#a8a8b0;}
.badge.on{filter:none;opacity:1;background:#fffaf0;box-shadow:inset 0 0 0 1px #ffe3a3;}
.b-ico{font-size:24px;}
.b-name{font-size:10.5px;font-weight:600;margin-top:3px;color:#444;}
.b-bar{height:4px;background:#e8e8ee;border-radius:2px;margin:5px 6px 3px;overflow:hidden;}
.b-bar i{display:block;height:100%;background:var(--orange);border-radius:2px;}
.badge.on .b-bar i{background:var(--green);}
.b-desc{font-size:8.5px;color:#a0a0a6;}
.year-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 10px;}
.year-nav b{font-size:14px;}
/* 年度总览:4行×3列月历格 */
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.ycell{background:#f6f7fa;border-radius:11px;padding:7px 8px 7px;min-height:60px;
  border:1px solid transparent;display:flex;flex-direction:column;}
.ycell.cur{border-color:#bcd9ff;background:#f3f8ff;}
.ycell.empty.cur{border-style:solid;border-color:#bcd9ff;background:#f3f8ff;}
.ycell.has{cursor:pointer;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06);
  transition:transform .12s;min-height:60px;}
.ycell.has:active{transform:scale(.97);}
.yc-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:5px;}
.yc-m{font-size:12px;font-weight:700;color:#333;}
.ycell.has .yc-m{color:#1c1c1e;}
.yc-n{font-size:9px;color:#1f9d46;font-weight:600;}
.yc-item{font-size:10px;color:#555;line-height:1.7;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;}
.yc-item .em{font-size:10.5px;margin-right:2px;}
.yc-more{font-size:9.5px;color:var(--blue);margin-top:2px;font-weight:500;}
/* 空月份:印章水印 + 右上角快捷加号 */
.ycell.empty{position:relative;align-items:center;justify-content:center;background:#fafbfd;
  border:1px dashed #e4e5ec;cursor:pointer;}
.ycell.empty:active{background:#f2f6ff;border-color:#bcd9ff;}
/* 印章水印:双圈红章 + 内字,轻微旋转,像真实盖章 */
.yc-seal{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(214,96,96,.38);
  display:flex;align-items:center;justify-content:center;transform:rotate(-15deg);
  color:rgba(206,78,78,.55);font-size:14px;font-weight:700;letter-spacing:.5px;
  margin:2px auto 0;box-shadow:inset 0 0 0 2.5px #fafbfd,inset 0 0 0 3.5px rgba(214,96,96,.28);}
.yc-add{position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;
  background:var(--blue);color:#fff;font-size:14px;line-height:19px;text-align:center;
  cursor:pointer;box-shadow:0 1px 4px rgba(0,122,255,.4);font-weight:400;}
.yc-add:active{transform:scale(.9);}
.ygrid{align-items:start;}
.ycell.has .yc-body{margin:auto 0;}
/* 月度弹窗明细 */
.md-list{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.md-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:8px 2px;
  border-bottom:1px solid #f2f2f5;text-align:left;}
.md-row:last-of-type{border-bottom:none;}
.md-name{flex:1;min-width:0;}
.md-hits{font-size:10.5px;color:#8a8a90;text-align:right;flex-shrink:0;line-height:1.5;}
.md-hits small{color:#b0b0b8;}
/* 勋章补充 */
.b-tag{position:absolute;top:0;left:0;font-size:7.5px;color:#fff;background:#f0a020;
  border-radius:11px 0 8px 0;padding:1px 5px 1.5px;line-height:1.4;font-weight:600;letter-spacing:.3px;}
.badge{position:relative;}
.badge-more{grid-column:1/-1;border:1.5px dashed #d3d3db;background:#fafafc;border-radius:11px;
  padding:9px;text-align:center;cursor:pointer;font-size:11.5px;color:#7a7a85;font-weight:500;}
.badge-more:active{background:#f0f1f6;}
.badge-more small{color:#a8a8b0;font-weight:400;}
.toast{position:absolute;top:62px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.86);
  color:#fff;font-size:12px;padding:8px 14px;border-radius:17px;z-index:99;max-width:88%;
  text-align:center;line-height:1.5;display:none;}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">9:41</div>
  <div id="app"></div>
  <div class="tabbar" id="tabbar">
    <div class="tab active" data-t="plans"><span class="ico">📋</span>计划</div>
    <div class="tab" data-t="cal"><span class="ico">📅</span>日历</div>
    <div class="tab" data-t="report"><span class="ico">📊</span>报告</div>
    <div class="tab" data-t="remind"><span class="ico">🔔</span>提醒</div>
    <div class="tab" data-t="me"><span class="ico">👤</span>我的</div>
  </div>
  <div id="overlay"></div>
  <div id="toast" class="toast"></div>
</div>
<script>
/* 计划星球 · 数据层(纯逻辑,可独立测试) */
/* 真实日期,真机使用 */
const TODAY = (function(){const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();

const fmt = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse = ds => { const [y,m,d]=ds.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (ds,n) => { const d=parse(ds); d.setDate(d.getDate()+n); return fmt(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const dow = ds => parse(ds).getDay();
const dom = ds => parse(ds).getDate();
const md = ds => ds.slice(5).replace("-","/");

let plans = [

  "2025-10-10":[{planId:1,taskId:11,status:"done",early:true}]
};

const STATUS = {
  done:   {key:"done",   c:"#34c759", t:"已完成"},
  skip:   {key:"skip",   c:"#b8b8bd", t:"已跳过"},
  later:  {key:"later",  c:"#ff9500", t:"稍后提醒"},
  overdue:{key:"overdue",c:"#ff3b30", t:"未完成"},
  todo:   {key:"todo",   c:"#007aff", t:"待完成"},
  future: {key:"future", c:"#c7c7cc", t:"未开始"}
};

/* 循环命中判定:weekday/monthday 为逗号分隔的多选,如 "1,3,5" / "1,15" */
function hitOn(task, ds){
  if(ds < task.start || ds > task.end) return false;
  if(task.rType === "once") return ds === (task.onceDate || task.start);
  switch(task.freq){
    case "everyday": return true;
    case "weekday":  { const w=dow(ds); return w>=1&&w<=5; }
    case "weekend":  { const w=dow(ds); return w===0||w===6; }
    case "weekly": {
      const days=String(task.weekday||"").split(",").filter(x=>x!=="");
      return days.includes(String(dow(ds)));
    }
    case "monthly": {
      const days=String(task.monthday||"").split(",").filter(x=>x!=="").map(Number);
      if(!days.length) return false;
      const last=new Date(parse(ds).getFullYear(), parse(ds).getMonth()+1, 0).getDate();
      const d=dom(ds);
      /* 每个选中的"几号"在小月顺延到月末;同一只命中一次 */
      return days.some(n=>d===Math.min(n,last));
    }
    case "everynday": {
      const step=Math.max(1,Number(task.freqX)||1);
      return diffDays(task.start,ds) % step === 0;
    }
    case "every2week": {
      const step=Math.max(1,Number(task.freqX)||1)*7;
      return diffDays(task.start,ds) % step === 0;
    }
    default: return false;
  }
}

function getRec(planId,taskId,ds){
  return (records[ds]||[]).find(r=>r.planId===planId && r.taskId===taskId);
}

function statusOf(planId,taskId,ds){
  const r = getRec(planId,taskId,ds);
  if(r){
    if(r.status==="done"){
      /* early=提前完成(未来日期勾选) makeup=补卡(过期日期补记) */
      if(r.early)  return {...STATUS.done, early:true};
      if(r.makeup) return {...STATUS.done, makeup:true};
      return STATUS.done;
    }
    if(r.status==="skip")    return STATUS.skip;
    if(r.status==="later")   return STATUS.later;
    if(r.status==="overdue") return STATUS.overdue;
    if(r.status==="temp")    return STATUS.done;
  }
  if(ds < TODAY)  return STATUS.overdue;
  if(ds === TODAY)return STATUS.todo;
  return STATUS.future;
}

/* 某天所有任务(实时推算未来) */
function tasksOnDate(ds){
  const out=[];
  plans.forEach(p=>{
    if(ds < p.start || ds > p.end) return;
    p.tasks.forEach(t=>{
      if(hitOn(t,ds)){
        out.push({planId:p.id,taskId:t.id,name:t.name,icon:t.icon,color:p.color,
                  time:t.time,plan:p,task:t,status:statusOf(p.id,t.id,ds)});
      }
    });
  });
  (records[ds]||[]).forEach(r=>{
    if(r.temp){
      const p=plans.find(x=>x.id===r.planId);
      out.push({planId:r.planId,taskId:0,name:r.name,icon:"✏️",
                color:p?p.color:"#8e8e93",time:"",plan:p,task:null,temp:true,status:STATUS.done});
    }
  });
  return out.sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));
}

/* 写入记录 */
function setRec(planId,taskId,ds,status,extra){
  const list = records[ds] = records[ds] || [];
  const i = list.findIndex(r=>r.planId===planId && r.taskId===taskId);
  if(i>=0) list[i] = {...list[i],status,...(extra||{})};
  else list.push({planId,taskId,status,...(extra||{})});
}
function toggleDone(planId,taskId,ds){
  const r=getRec(planId,taskId,ds);
  if(r && r.status==="done"){
    const list=records[ds];
    list.splice(list.findIndex(x=>x.planId===planId&&x.taskId===taskId),1);
    return {done:false};
  }
  /* 提前完成:勾选尚未到期的日期;补卡:补记已过期未完成的日期 */
  const early = ds > TODAY;
  const makeup = ds < TODAY;
  setRec(planId,taskId,ds,"done",{early,makeup});
  return {done:true, early, makeup};
}

const pct=(n,d)=> d ? Math.round(n/d*100) : 0;

/* 统计:逐日推算全部实例,含未来 */
function collectStats(s,e){
  const byPlan={}, byTask={}, daily={}, tempByPlan={};
  const blank=()=>({done:0,early:0,skip:0,overdue:0,todo:0,total:0});
  let ds=s;
  while(ds<=e){
    const list=tasksOnDate(ds);
    daily[ds]={done:0,total:0};
    list.forEach(x=>{
      const pk=x.planId;
      byPlan[pk]=byPlan[pk]||blank();
      const tk=pk+"|"+(x.taskId||"temp");
      byTask[tk]=byTask[tk]||{planId:pk,taskId:x.taskId,name:x.name,temp:!!x.temp,
                             color:x.color,icon:x.icon,...blank()};
      const P=byPlan[pk], T=byTask[tk], D=daily[ds];
      D.total++;
      P.total++; T.total++;
      const k=x.status.key;
      if(k==="done"){ P.done++;T.done++;D.done++; if(x.status.early){P.early++;T.early++;} }
      else if(k==="skip"){ P.skip++;T.skip++; }
      else if(k==="overdue"){ P.overdue++;T.overdue++; }
      else { P.todo++;T.todo++; }
      if(x.temp){ tempByPlan[pk]=(tempByPlan[pk]||0)+1; }
    });
    ds=addDays(ds,1);
  }
  return {byPlan,byTask,daily,tempByPlan};
}

<script>
/* 计划星球 · 视图层 */
let view="plans", openPlanId=null, calSel=TODAY, curMonth=null;

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function toast(m){
  const t=$("#toast"); t.textContent=m; t.style.display="block";
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",2200);
}

/* 频率文案 */
const FREQ_TXT={everyday:"每天",weekday:"工作日每天",weekend:"周末每天",
  weekly:"每周",monthly:"每月",everynday:"每隔",every2week:"每隔"};
const WD=["周日","周一","周二","周三","周四","周五","周六"];
function freqText(t){
  if(t.rType==="once") return "只提醒一次";
  switch(t.freq){
    case "everyday": return "每天";
    case "weekday":  return "工作日每天";
    case "weekend":  return "周末每天";
    case "weekly": {
      const days=String(t.weekday||"").split(",").filter(x=>x!=="").map(Number).sort((a,b)=>a-b);
      if(!days.length) return "每周 ?";
      /* 单选用"每周六",多选用"每周一、三、五",避免"每周周六"这种重复 */
      if(days.length===1) return "每"+WD[days[0]];
      return "每周"+days.map(d=>WD[d].slice(1)).join("、");
    }
    case "monthly": {
      const days=String(t.monthday||"").split(",").filter(x=>x!=="").map(Number).sort((a,b)=>a-b);
      return "每月 "+(days.length?days.join("、"):"?")+" 号";
    }
    case "everynday":return "每隔 "+(t.freqX||"?")+" 天";
    case "every2week":return "每隔 "+(t.freqX||"?")+" 周";
    default: return "每天";
  }
}
function remindText(t){
  if(t.rType==="once") return "只提醒一次 · "+(t.onceDate||t.start)+" "+t.time;
  return freqText(t)+" · "+t.time;
}
function depName(t,plan){
  if(!t.dep) return "";
  const d=plan.tasks.find(x=>String(x.id)===String(t.dep));
  return d?d.name:"";
}
function hitCount(t){
  let n=0,ds=t.start;
  while(ds<=t.end){ if(hitOn(t,ds)) n++; ds=addDays(ds,1); }
  return n;
}

/* ================= 渲染 ================= */

}

/* ================= 计划列表 ================= */

/* ================= 计划详情(编辑入口 + 新版甘特图) ================= */

        <div class="t-sub">📆 ${t.start} ~ ${t.end}${dep?" · ↳ "+esc(dep):""}</div>

  h+=`</div></div>`;
  return h;

/* 甘特图:按月分块,每天一格,命中着色 */
function ganttHtml(p){
  /* 以月为单位分块显示,最多显示 4 个月,可翻页 */
  const months=[];
  let d=parse(p.start), end=parse(p.end);
  while(d<=end && months.length<24){
    months.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));
    d=new Date(d.getFullYear(),d.getMonth()+1,1);
  }
  const cur=ganttMonth||months[0];

  let h=`<div class="card">
    <div class="card-title">进度甘特图
      <span class="gtip">每格=1天,有色=当天要做</span></div>
    <div class="gantt-nav">
      <span class="gnav" onclick="shiftGantt(-1)">‹</span>
      <b>${cur.replace("-"," 年 ")} 月</b>
      <span class="gnav" onclick="shiftGantt(1)">›</span>
    </div>`;

  const [yy,mm]=cur.split("-").map(Number);
  const lastDay=new Date(yy,mm,0).getDate();

  h+=`<div class="g-legend">
    <span><i style="background:#34c759"></i>已完成</span>
    <span><i style="background:#ff3b30"></i>未完成</span>
    <span><i style="background:#007aff"></i>待完成</span>
    <span><i style="background:#e4e4ea"></i>未开始</span>
  </div>`;

  /* 表头日期 */
  h+=`<div class="g-wrap"><div class="g-labels"><div class="g-lh"></div>`;
  p.tasks.forEach(t=>{ h+=`<div class="g-l">${t.icon} ${esc(t.name)}</div>`; });
  h+=`</div><div class="g-scroll"><div class="g-days">`;
  for(let i=1;i<=lastDay;i++){
    const showLabel = (i===1 || i%5===0);
    h+=`<div class="g-d">${showLabel?i:""}</div>`;
  }
  h+=`</div>`;
  p.tasks.forEach(t=>{
    h+=`<div class="g-row2">`;
    for(let i=1;i<=lastDay;i++){
      const ds=`${yy}-${String(mm).padStart(2,"0")}-${String(i).padStart(2,"0")}`;
      const inRange = ds>=t.start && ds<=t.end && ds>=p.start && ds<=p.end;
      const hit = inRange && hitOn(t,ds);
      let bg, cls="", title=ds;
      if(hit){
        const st=statusOf(p.id,t.id,ds);
        bg=st.c; title=ds+" "+st.t;
      }else if(inRange){
        bg="#ececf2"; title=ds+" 无任务";
      }else{
        bg="#fbfbfd"; cls="blank"; title=ds+" 不在任务周期";
      }
      h+=`<div class="g-cell ${cls}" style="background:${bg}" title="${title}"></div>`;
    }
    h+=`</div>`;
  });
  h+=`</div></div>`;

  /* 每个任务的频率摘要 */
  h+=`<div class="g-summary">`;
  p.tasks.forEach(t=>{
    const n=hitCount(t);
    const doneN=countDone(p.id,t.id);
    h+=`<div class="gs-row"><b>${t.icon} ${esc(t.name)}</b>
      <span>${remindText(t)}</span>
      <span class="gs-right">共 ${n} 次 · 已完成 ${doneN}</span></div>`;
  });
  h+=`</div></div>`;
  return h;
}
let ganttMonth=null;
function shiftGantt(n){
  const p=plans.find(x=>x.id===openPlanId);
  const cur=ganttMonth||p.start.slice(0,7);
  let [y,m]=cur.split("-").map(Number);
  m+=n; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  ganttMonth=y+"-"+String(m).padStart(2,"0");
  render();
}
function countDone(planId,taskId){
  let n=0;
  Object.keys(records).forEach(ds=>{
    (records[ds]||[]).forEach(r=>{ if(r.planId===planId&&r.taskId===taskId&&r.status==="done") n++; });
  });
  return n;
}

/* ================= 日历(可预览未来 + 可勾选完成) ================= */
function calendarPage(){
  const base=curMonth||calSel.slice(0,7);
  const [y,m]=base.split("-").map(Number);
  const firstDay=new Date(y,m-1,1);
  const days=new Date(y,m,0).getDate();
  const lead=(firstDay.getDay()+6)%7;

  let cells="";
  for(let i=0;i<lead;i++) cells+=`<div></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const list=tasksOnDate(ds);
    const dots=list.slice(0,4).map(x=>`<i style="background:${x.status.c}"></i>`).join("");
    const more=list.length>4?`<span class="cmore">+${list.length-4}</span>`:"";
    cells+=`<div class="cal-cell ${ds===TODAY?'today':''} ${ds===calSel?'sel':''}" onclick="calSel='${ds}';render()">
      <span class="cd">${d}</span><div class="cal-dots">${dots}${more}</div></div>`;
  }

  let h=`<div class="nav"><h1>日历</h1></div><div class="page"><div class="card">
    <div class="cal-head"><span class="cal-nav" onclick="shiftMonth(-1)">‹</span>
      <b>${y} 年 ${m} 月</b>
      <span class="cal-nav" onclick="shiftMonth(1)">›</span></div>
    <div class="cal-grid head">${["一","二","三","四","五","六","日"].map(w=>`<div>${w}</div>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <div class="remark">点日期查看当天任务;未来日期的任务已按循环规则预生成,可直接提前勾选完成</div>
  </div>`;

  /* 当天任务列表:可勾选 */
  const list=tasksOnDate(calSel);
  h+=`<div class="card"><div class="card-title">${calSel}${calSel===TODAY?" · 今天":""}
    <span class="tip">${list.length} 项任务</span></div>`;
  if(!list.length) h+=`<div class="empty">这一天没有任务</div>`;
  list.forEach(x=>{
    const isDone=x.status.key==="done";
    /* 状态标签:已完成时附加 提前/补卡 标记 */
    let tagTxt=x.status.t;
    if(isDone&&x.status.early) tagTxt="已完成·提前";
    else if(isDone&&x.status.makeup) tagTxt="已完成·补卡";
    const tagHtml=(x.temp?'<span class="tag">临时</span>':'')
      +(isDone&&x.status.early?'<span class="tag early-tag">提前</span>':'')
      +(isDone&&x.status.makeup?'<span class="tag makeup-tag">补卡</span>':'');
    h+=`<div class="task ${x.status.key==='overdue'?'dim':''}">
      <div class="chk ${isDone?'on':''}" onclick="onToggle(${x.planId},${x.taskId},'${calSel}')">
        ${isDone?'✓':''}</div>
      <div class="t-main">
        <div class="t-name ${isDone?'strike':''}">${x.icon} ${esc(x.name)}${tagHtml}</div>
        <div class="t-sub">${x.plan?esc(x.plan.name):""}${x.time?" · "+x.time:""}</div>
      </div>
      <div class="st-tag" style="color:${x.status.c};border-color:${x.status.c}44;background:${x.status.c}12">${tagTxt}</div>
    </div>`;
  });
  h+=`<button class="ghost" onclick="openTempForm()">+ 在这一天补记临时任务</button></div>`;
  return h+`</div>`;
}
function onToggle(planId,taskId,ds){
  if(!taskId) return toast("临时任务无需勾选");
  const res=toggleDone(planId,taskId,ds);
  if(!res.done){ toast("↩ 已取消完成"); render(); return; }
  if(res.early){
    /* 提前完成循环任务(间隔型)时,询问循环节奏 */
    const p=plans.find(x=>x.id===planId);
    const t=p&&p.tasks.find(x=>x.id===taskId);
    const spaced=t&&(t.rType==="loop"&&(t.freq==="everynday"||t.freq==="every2week"||t.freq==="weekly"||t.freq==="monthly"));
    render();
    if(spaced) askLoopChoice(planId,taskId,t,ds);
    else toast("✅ 已提前完成");
    return;
  }
  if(res.makeup){ toast("✅ 已补卡完成(标记为补卡)"); render(); return; }
  toast("✅ 已标记完成"); render();
}
/* 提前完成间隔型循环任务:选择后续循环节奏 */

  const step=t.freq==="every2week"?`${t.freqX||2} 周`:t.freq==="everynday"?`${t.freqX||1} 天`:"1 个周期";

function shiftMonth(n){
  const base=curMonth||calSel.slice(0,7);
  let [y,m]=base.split("-").map(Number);
  m+=n; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  curMonth=y+"-"+String(m).padStart(2,"0");
  calSel=`${curMonth}-01`;
  render();
}

/* ================= 报告(原地展开 + 全量统计) ================= */
function reportPage(){
  const st=collectStats(reportRange.s,reportRange.e);
  let tot={done:0,early:0,skip:0,overdue:0,todo:0,total:0};
  Object.values(st.byPlan).forEach(v=>["done","early","skip","overdue","todo","total"].forEach(k=>tot[k]+=v[k]));
  const totalTemp=Object.values(st.tempByPlan).reduce((a,b)=>a+b,0);
  const score=Math.min(100,Math.round(pct(tot.done,tot.total)*0.65 + pct(tot.early,tot.done||1)*0.15 + 70*0.2));

  /* 指标条形图:每个指标带 ⓘ,点击查看统计口径 */
  const bar=(l,v,c)=>`<div class="bar-row"><div class="lbl">${l}
      <span class="info-i" onclick="event.stopPropagation();metricInfo('${l}')">ⓘ</span></div>

    <div class="val">${v}%</div></div>`;

  let h=`<div class="nav"><h1>进展报告</h1></div><div class="page">`;

  /* 时间段 */
  h+=`<div class="card"><div class="card-title">统计时间段<span class="tip">选完日期自动重新统计</span></div>

    <div class="remark">${reportRange.s} ~ ${reportRange.e} · 应完成 <b>${tot.total}</b> 次 · 完成 <b>${tot.done}</b> · 跳过 ${tot.skip} · 未完成 ${tot.overdue} · 额外补记 ${totalTemp}</div>
  </div>`;

  /* 总分 */
  h+=`<div class="card score">
    <div class="score-num" style="background:conic-gradient(#34c759 0 ${score*3.6}deg,#eee ${score*3.6}deg 360deg)">
      <b>${score}</b></div>
    <div class="score-info"><b>综合得分 ${score} / 100</b>
      <span>完成率 65% + 及时性 15% + 持续性 20%</span></div></div>`;

  h+=`<div class="card">${bar("完成率",pct(tot.done,tot.total),"#34c759")}
    ${bar("提前完成率",pct(tot.early,tot.done||1),"#30b0c7")}
    ${bar("滞后完成率",pct(tot.done-tot.early,tot.done||1),"#ff9500")}
    ${bar("跳过率",pct(tot.skip,tot.total),"#b8b8bd")}
    ${bar("未完成率",pct(tot.overdue,tot.total),"#ff3b30")}
    ${bar("待完成率",pct(tot.todo,tot.total),"#007aff")}
  </div>`;

  /* 计划维度:原地展开 */
  h+=`<div class="card"><div class="card-title">计划维度<span class="tip">点计划行展开任务明细</span></div>`;
  plans.forEach(p=>{
    const ps=st.byPlan[p.id];
    const o=ps||{done:0,early:0,skip:0,overdue:0,todo:0,total:0};
    const opened=!!expanded[p.id];
    h+=`<div class="prow" onclick="toggleExpand(${p.id})">
      <span class="arrow ${opened?'down':''}">›</span>
      <span class="pname" style="color:${p.color}">${p.icon} ${esc(p.name)}</span>
      <span class="pstats">${pct(o.done,o.total)}%</span>
      <span class="pmini">${o.done}/${o.total}</span>
    </div>`;
    if(opened){
      h+=`<div class="pexpand">
        <div class="psub">
          <span>完成 ${o.done}</span><span>提前 ${o.early}</span><span>跳过 ${o.skip}</span>
          <span>过期 ${o.overdue}</span><span>待完成 ${o.todo}</span>
        </div>
        <table class="rtable">
          <tr><th>任务</th><th>应完成</th><th>完成</th><th>完成率</th><th>提前率</th><th>跳过</th><th>过期</th></tr>`;
      /* 该计划下所有任务都要出现,包括区间内 0 次的 */
      p.tasks.forEach(t=>{
        const tk=p.id+"|"+t.id;
        const ts=st.byTask[tk]||{done:0,early:0,skip:0,overdue:0,todo:0,total:0};
        const flag = ts.total===0 ? `<span class="norec">区间内无排期</span>` : "";
        h+=`<tr class="${ts.total===0?'zero':''}">
          <td>${t.icon} ${esc(t.name)}${flag}</td>

          <td><b>${pct(ts.done,ts.total)}%</b></td>
          <td>${pct(ts.early,ts.done||1)}%</td>
          <td>${ts.skip}</td>
          <td class="${ts.overdue?'red':''}">${ts.overdue}</td></tr>`;
      });
      /* 临时任务单独一行 */
      const tempRows=Object.values(st.byTask).filter(x=>x.planId===p.id&&x.temp);
      tempRows.forEach(x=>{
        h+=`<tr class="tempr"><td>✏️ ${esc(x.name)}<span class="tag">临时</span></td>
          <td>—</td><td>${x.done}</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>`;
      });
      h+=`</table></div>`;
    }
  });
  h+=`</div>`;

  /* 建议 */
  h+=`<div class="card"><div class="card-title">💡 分析建议</div><div class="advice">`;
  let any=false;
  plans.forEach(p=>{
    const o=st.byPlan[p.id]; if(!o||!o.total) return;
    const over=pct(o.overdue,o.total), skip=pct(o.skip,o.total), doneR=pct(o.done,o.total);
    if(over>15){any=true;h+=`· 「${esc(p.name)}」过期 ${o.overdue} 次(未完成率 ${over}%):提醒时间或任务量需要调整<br>`;}
    if(skip>20){any=true;h+=`· 「${esc(p.name)}」跳过率 ${skip}%:该任务节奏与实际不符,建议降低频率<br>`;}
    if(doneR>=80&&o.total>3){any=true;h+=`· 「${esc(p.name)}」完成率 ${doneR}%,执行稳定,可考虑提升难度<br>`;}
  });
  if(totalTemp>0){any=true;h+=`· 有 ${totalTemp} 次额外补记:可把高频临时事项转为正式任务<br>`;}
  if(!any) h+=`· 当前时段数据不足以给出建议`;
  h+=`</div></div>`;
  return h+`</div>`;
}

const METRIC_DEFS={

  "额外任务占比":"临时补记的任务次数 ÷ 全部完成任务次数。临时任务不占正式计划的应完成额度,单独衡量计划外的自驱行为。"

function savePlan(planId){
  clearErrs();
  const name=$("#pf-name").value.trim();
  if(!name) return showErr("pf-name","请填写计划名称");
  const s=$("#pf-start").value,e=$("#pf-end").value;
  if(!s||!e) return showErr("pf-end","请选择时间范围");
  if(s>e) return showErr("pf-end","结束时间不能早于开始时间");
  const depOn=$("#pf-dep-on").checked;
  const depSel=$("#pf-dep");
  if(depOn&&(!depSel||!depSel.value)) return toast("已开启依赖,请选择计划");

  if(planId){
    const p=plans.find(x=>x.id===planId);
    /* 时间收缩时同步调整任务 */
    let shrunk=[];
    p.tasks.forEach(t=>{
      if(t.start<s){ t.start=s; shrunk.push(t.name); }
      if(t.end>e){ t.end=e; shrunk.push(t.name); }
    });
    Object.assign(p,{name,icon:pickedIcon("pf-icons"),start:s,end:e,depPlan:depOn?depSel.value:""});
    closeOverlay();
    toast(shrunk.length?`✅ 已保存,${[...new Set(shrunk)].length} 个任务时间已同步收缩`:"✅ 计划已更新");
  }else{
    const nid=Date.now();
    plans.push({id:nid,name,icon:pickedIcon("pf-icons"),color:"#af52de",
      start:s,end:e,depPlan:depOn?depSel.value:"",tasks:[]});
    closeOverlay();
    /* 没有任务的计划不会产生任何排期,引导用户顺手把任务加上 */
    toast("✅ 计划已创建,再添加任务才会有排期");
    setTimeout(()=>{ openTaskForm(nid); }, 700);
  }
  render();
}

function multiTipText(box,type){
  const sel=$$("#"+box+" span.on").map(s=>Number(s.dataset.v)).sort((a,b)=>a-b);
  if(!sel.length) return "尚未选择,请至少选择一项";

function readRemind(pre){
  const rType=$("#"+pre+"-rtype").value;
  const time=$("#"+pre+"-time").value;
  if(!time) return {err:"请选择提醒时间"};
  if(rType==="once"){
    const d=$("#"+pre+"-once").value;
    if(!d) return {err:"请选择提醒日期"};
    return {rType,time,onceDate:d,freq:"",freqX:"",weekday:"",monthday:""};
  }
  const freq=$("#"+pre+"-freq").value;
  const out={rType,time,freq,freqX:"",weekday:"",monthday:"",onceDate:""};
  if(freq==="weekly"){
    /* 多选:收集所有选中的周几 */
    const sel=$$("#"+pre+"-wd span.on").map(s=>Number(s.dataset.v)).sort((a,b)=>a-b);
    if(!sel.length) return {err:"每周(几)模式下,请至少选择一个星期几"};
    out.weekday=sel.join(",");
  }
  if(freq==="monthly"){
    /* 多选:收集所有选中的几号 */
    const sel=$$("#"+pre+"-md span.on").map(s=>Number(s.dataset.v)).sort((a,b)=>a-b);
    if(!sel.length) return {err:"每月(几号)模式下,请至少选择一个日期"};
    out.monthday=sel.join(",");
  }
  if(freq==="everynday"||freq==="every2week"){
    const raw=$("#"+pre+"-x").value.trim();
    const n=Number(raw);
    if(!raw||!Number.isFinite(n)||n<1) return {err:"请填写间隔 x(≥1 的整数)"};
    out.freqX=String(Math.round(n));
  }
  return out;
}
function saveTask(planId,taskId){
  clearErrs();
  const p=plans.find(x=>x.id===planId);
  const name=$("#tf-name").value.trim();
  if(!name) return showErr("tf-name","请先填写任务名称");
  const s=$("#tf-start").value,e=$("#tf-end").value;
  if(!s||!e) return showErr("tf-end","请选择时间范围");
  if(s>e) return showErr("tf-end","结束时间不能早于开始时间");
  if(s<p.start||e>p.end) return showErr("tf-end","任务需在计划 "+p.start+" ~ "+p.end+" 内");
  const r=readRemind("tf");
  if(r.err) return showErr("tf-x",r.err);
  const depOn=$("#tf-dep-on").checked, depSel=$("#tf-dep");
  if(depOn&&(!depSel||!depSel.value)) return toast("已开启依赖,请选择任务");
  const data={name,icon:pickedIcon("tf-icons"),start:s,end:e,...r,dep:depOn&&depSel?depSel.value:""};
  if(taskId) Object.assign(p.tasks.find(x=>x.id===taskId),data);
  else p.tasks.push({id:Date.now(),...data});
  closeOverlay(); toast(taskId?"✅ 任务已更新":"✅ 任务已创建"); render();
}

function doDeleteTask(planId,taskId){
  const p=plans.find(x=>x.id===planId);
  p.tasks=p.tasks.filter(x=>x.id!==taskId);
  p.tasks.forEach(t=>{ if(String(t.dep)===String(taskId)) t.dep=""; });

let meYear=Number(TODAY.slice(0,4));   /* 默认当前年 */

function myStats(){
  /* 遍历从最早计划开始到今天的每一天,统计累计数据(计划维度) */
  let start=TODAY;
  plans.forEach(p=>{ if(p.start<start) start=p.start; });
  let done=0,early=0,temp=0,plansTouched=new Set(),days=0;
  let ds=start;
  while(ds<=TODAY){
    let dayDone=0;
    (records[ds]||[]).forEach(r=>{
      if(r.status==="done"||r.status==="temp"){ done++; dayDone++; plansTouched.add(r.planId); if(r.early)early++; }
      if(r.temp) temp++;
    });
    if(dayDone>0) days++;
    ds=addDays(ds,1);
  }
  /* 连续打卡:从今天往回数(今天没打卡则从昨天起) */
  let streak=0, cur=(records[TODAY]||[]).some(r=>r.status==="done"||r.status==="temp")?TODAY:addDays(TODAY,-1);
  while((records[cur]||[]).some(r=>r.status==="done"||r.status==="temp")){
    streak++; cur=addDays(cur,-1);
  }
  /* 计划维度:已收官计划数 + 年内连续有排期的月份数 */
  const planDone=plans.filter(planFinished).length;
  const months=yearOverview(TODAY.slice(0,4));
  let monthStreak=0,run=0;
  months.forEach(mo=>{ if(mo.items.length){run++; if(run>monthStreak)monthStreak=run;} else run=0; });
  return {done,early,temp,streak,activeDays:days,plansTouched:plansTouched.size,
          planCount:plans.length, joinDays:diffDays(start,TODAY)+1, planDone, monthStreak};
}

/* 计划是否已"完美收官":已结束且结束前所有排期都有完成/跳过记录 */
function planFinished(p){
  if(p.end>=TODAY) return false;
  const full=p.tasks.every(t=>{
    let ds=t.start;
    const tEnd=t.end;
    while(ds<=tEnd){
      if(hitOn(t,ds)){
        const rec=(records[ds]||[]).find(r=>r.taskId===t.id);
        if(!rec||!("status" in rec)||(rec.status!=="done"&&rec.status!=="skip")) return false;
      }
      ds=addDays(ds,1);
    }
    return true;
  });
  return full;
}

/* 某年 12 个月,每月包含哪些计划与排期次数 */
function yearOverview(y){
  const months=[];
  for(let m=1;m<=12;m++){
    const mStr=`${y}-${String(m).padStart(2,"0")}`;
    const first=mStr+"-01";
    const lastD=new Date(y,m,0).getDate();
    const last=`${mStr}-${String(lastD).padStart(2,"0")}`;
    const items=[];
    plans.forEach(p=>{
      /* 计划与该月有交集 */
      if(p.end<first||p.start>last) return;
      const from=p.start>first?p.start:first;
      const to=p.end<last?p.end:last;
      let hits=0;
      p.tasks.forEach(t=>{
        let ds=t.start>from?t.start:from;
        const tEnd=t.end<to?t.end:to;
        while(ds<=tEnd){ if(hitOn(t,ds)) hits++; ds=addDays(ds,1); }
      });
      if(hits>0) items.push({plan:p,hits});
    });
    months.push({m:mStr,items});
  }
  return months;
}

function monthDetail(m){
  const mo=(_yearMonths||[]).find(x=>x.m===m);
  if(!mo||!mo.items.length) return;
  const y=m.slice(0,4);
  let rows=mo.items.map(i=>`<div class="md-row">
      <span class="dot" style="background:${i.plan.color}"></span>
      <span class="md-name"><span class="em">${i.plan.icon}</span>${esc(i.plan.name)}</span>
      <span class="md-hits">排期 ${i.hits} 次<br><small>${i.plan.start} ~ ${i.plan.end}</small></span>
    </div>`).join("");
  overlay(`<div class="mask center" onclick="if(event.target===this)closeOverlay()"><div class="sheet">
    <h3>📅 ${y}年${Number(m.slice(5))}月</h3>
    <p style="text-align:center;color:#8a8a90;font-size:12.5px;margin-bottom:10px">
      共 ${mo.items.length} 个计划 · ${mo.items.reduce((a,b)=>a+b.hits,0)} 次排期</p>
    <div class="md-list">${rows}</div>
    <button class="primary" onclick="closeOverlay()">好的</button>
  </div></div>`);
}
function badgeInfo(name,desc,got,prog,max){

    <div style="text-align:center;font-size:44px;margin:4px 0 8px">${got?"🏅":"🔒"}</div>
    <h3>${name}</h3>
    <p style="text-align:center;color:#8a8a90;font-size:13px;margin-bottom:10px">${desc}</p>
    <p style="text-align:center;font-size:14px">${got?"🎉 已解锁!继续保持":"进度:"+prog+" / "+max}</p>

}

<script>
/* ============ PWA 增强:持久化 / 开屏提醒 / 日历导出 / 重置 ============ */
(function(){
  const KEY='planstar_data_v1';
  const DEMO_TODAY='2025-10-10';   /* 示例数据锚定日期 */

  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify({plans:plans, records:records})); }catch(e){}
  }
  function load(){
    try{
      const d=JSON.parse(localStorage.getItem(KEY));
      if(d && Array.isArray(d.plans) && d.plans.length){ plans=d.plans; records=d.records||{}; return true; }
    }catch(e){}
    return false;
  }
  /* 示例数据整体平移到"今天"附近,保留演示观感 */
  function shiftDemo(){
    const d=diffDays(DEMO_TODAY, TODAY);
    if(!d) return;
    plans.forEach(p=>{
      p.start=addDays(p.start,d); p.end=addDays(p.end,d);
      p.tasks.forEach(t=>{
        t.start=addDays(t.start,d); t.end=addDays(t.end,d);
        if(t.onceDate) t.onceDate=addDays(t.onceDate,d);
      });
    });
    const nk={};
    Object.keys(records).forEach(k=>{ nk[addDays(k,d)]=records[k]; });
    /* records 可能是 const 声明,原地替换内容 */
    Object.keys(records).forEach(k=>{ delete records[k]; });
    Object.keys(nk).forEach(k=>{ records[k]=nk[k]; });
  }

  /* render 后自动保存;myPage 增加导出/重置入口 */
  const _render=render;
  render=function(){ _render(); save(); };
  const _myPage=myPage;
  myPage=function(){
    return _myPage()+
      `<div class="card">
        <div class="card-title">数据与日历</div>
        <button class="primary" style="margin-top:10px" onclick="exportICS()">📅 导出到 iPhone 系统日历</button>
        <div class="remark" style="text-align:center;margin-top:10px;cursor:pointer;color:#007aff"
             onclick="resetAll()">↺ 清空数据,恢复示例</div>
      </div>`;
  };
  window.resetAll=function(){
    if(confirm("将清空你的全部计划与打卡记录,恢复示例数据。确定吗?")){
      try{ localStorage.removeItem(KEY); }catch(e){}
      location.reload();
    }
  };

  /* 导出到系统日历(.ics,浮动本地时间,iOS 日历直接识别) */
  window.exportICS=function(){
    const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//PlanStar//PWA//CN","CALSCALE:GREGORIAN","X-WR-CALNAME:计划星球"];
    const dt=s=>s.replace(/-/g,"");
    let n=0, ds=TODAY;
    const end=addDays(TODAY,60);
    while(ds<=end){
      tasksOnDate(ds).forEach(x=>{
        if(x.status.key==="done"||x.status.key==="skip") return;
        const parts=(x.time||"08:00").split(":");
        const hh=Number(parts[0])||0, mm=Number(parts[1])||0;
        const pad=v=>String(v).padStart(2,"0");
        const st=dt(ds)+"T"+pad(hh)+pad(mm)+"00";
        const en=dt(ds)+"T"+pad(Math.min(hh+1,23))+pad(mm)+"00";
        lines.push("BEGIN:VEVENT",
          "UID:planstar-"+x.planId+"-"+x.taskId+"-"+dt(ds)+"@planstar.local",
          "DTSTART:"+st, "DTEND:"+en,
          "SUMMARY:"+(x.icon?x.icon+" ":"")+x.name,
          "DESCRIPTION:"+x.plan.name+" · 来自计划星球",
          "BEGIN:VALARM","TRIGGER:-PT10M","ACTION:DISPLAY",
          "DESCRIPTION:计划提醒","END:VALARM","END:VEVENT");
        n++;
      });
      ds=addDays(ds,1);
    }
    lines.push("END:VCALENDAR");
    const blob=new Blob([lines.join("\r\n")],{type:"text/calendar;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="planstar.ics";
    document.body.appendChild(a); a.click(); a.remove();
    toast(n? "📅 已生成 "+n+" 条日程,请在弹出的下载中打开并导入日历"
           : "未来 60 天没有待完成日程");
  };

  /* 开屏补提醒:列出今天未完成的任务 */
  window.openTodayRemind=function(){
    const pend=tasksOnDate(TODAY).filter(x=>
      x.status.key==="todo"||x.status.key==="overdue"||x.status.key==="later");
    if(!pend.length) return;
    overlay(`<div class="mask center" onclick="if(event.target===this)closeOverlay()"><div class="sheet">
      <h3>🔔 今日待办 ${pend.length} 项</h3>
      <div style="margin:8px 0 12px">
      ${pend.map(x=>`<div class="md-row">
        <span class="dot" style="background:${x.color}"></span>
        <span class="md-name">${x.icon} ${esc(x.name)}</span>
        <span class="md-hits">${x.time}</span></div>`).join("")}
      </div>
      <button class="primary" onclick="closeOverlay()">知道了</button>
      <button class="secondary" onclick="closeOverlay();exportICS()">📅 导出到系统日历</button>
    </div></div>`);
  };

  /* 启动流程:恢复数据 → 平移示例 → 重绘 → 开屏提醒 */
  const had=load();
  if(!had) shiftDemo();
  render();
  setTimeout(openTodayRemind, 600);

  /* Service Worker:https 环境才注册(本地 file:// 调试自动跳过) */
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
